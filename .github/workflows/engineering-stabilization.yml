name: Engineering Stabilization

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-gate:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile source
        run: python -m compileall -q src scripts
      - name: Engineering and security checks
        run: python scripts/engineering_check.py
      - name: Observability schema and security checks
        run: python scripts/observability_check.py
      - name: Verify generated API artifacts
        shell: pwsh
        run: |
          python scripts/sync_openapi.py
          git diff --exit-code -- docs/openapi.json web/generated/client.js
      - name: Verify JavaScript and HTML contracts
        shell: pwsh
        run: |
          node --check web/app.js
          node --check web/generated/client.js
          python scripts/check_html_ids.py
      - name: Run all tests with JUnit report
        run: python -m pytest tests -q --junitxml=pytest-report.xml
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: pytest-report.xml
          if-no-files-found: error
