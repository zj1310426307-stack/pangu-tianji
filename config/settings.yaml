environment:
  mode: paper
  live_trading_enabled: false
  require_manual_confirmation: true

account:
  initial_cash: 100000.0

investment_profile:
  capital: 100000.0
  risk_level: balanced
  investment_horizon: medium
  max_drawdown_tolerance: 0.10
  investment_style: balanced

research:
  enabled: true
  strategy_version: "cross-sectional-v2.0.0"
  market: "sh_sz_mainboard"
  snapshot_limit: 10000
  minimum_turnover: 50000000
  minimum_price: 2.0
  maximum_price: 200.0
  prefilter_count: 120
  financial_count: 60
  recommendation_count: 30
  target_count: 5
  entry_rank: 8
  hold_rank: 20
  max_positions_per_industry: 2
  max_pairwise_correlation: 0.85
  max_single_position_pct: 0.15
  target_total_exposure_pct: 0.60
  history_days: 520
  minimum_history_rows: 250
  quote_max_age_seconds: 120

paper_account:
  enabled: true
  automatic_execution: true
  initial_cash: 100000.0
  max_positions: 5
  target_position_pct: 0.15
  max_total_exposure_pct: 0.60
  hold_rank: 20
  minimum_holding_days: 5
  max_daily_turnover_pct: 0.25
  stop_loss_pct: 0.08
  max_drawdown_pct: 0.10
  execute_time: "09:35"
  execution_window_minutes: 10
  monitor_interval_minutes: 5
  quote_refresh_seconds: 5

universe:
  symbols:
    - "510300.SH"
    - "510500.SH"
    - "159915.SZ"
    - "512100.SH"

strategy:
  long_ma_window: 60
  momentum_window: 20
  max_positions: 1
  rebalance_weekday: 0
  target_total_exposure_pct: 0.80

risk:
  max_total_exposure_pct: 0.90
  max_single_position_pct: 0.90
  max_order_value_pct: 0.90
  max_orders_per_day: 4
  reject_duplicate_orders: true
  reject_unknown_symbols: true
  kill_switch: false

execution:
  lot_size: 100
  allow_fractional_lots: false
  unknown_order_retry: false

costs:
  commission_rate: 0.0003
  minimum_commission: 5.0
  sell_tax_rate: 0.0005
  transfer_fee_rate: 0.00001
  slippage_rate: 0.001

data:
  provider: ths_finance
  base_url: "https://fuyao.aicubes.cn"
  api_key_env: "THS_FINANCE_API_KEY"
  start_date: "2023-01-03"
  end_date: "latest"
  interval: "1d"
  adjust: "none"
  request_timeout_seconds: 20
  minimum_rows: 120
  allow_cached_on_error: true
  max_staleness_days: 10

storage:
  sqlite_path: "output/agent.db"

daily_investment_os:
  enabled: true
  morning_time: "08:45"
  intraday_interval_minutes: 60
  intraday_start: "09:45"
  intraday_end: "14:45"
  closing_time: "15:30"
  weekly_weekday: 4
  weekly_time: "16:00"
  email_enabled: false
  email_starttls: true

ai_quant_research:
  enabled: true
  morning_time: "08:00"
  timezone: "Asia/Shanghai"
  trading_days_only: true
  missed_slots_backfilled: false
  permission: "RESEARCH_READ_ONLY"

mobile_assistant:
  # Mobile mode remains disabled unless server.py is started with --mobile.
  token_ttl_minutes: 720
  pairing_ttl_seconds: 300
  pairing_max_attempts: 5
